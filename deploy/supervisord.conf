[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/nganyaflow-supervisord.pid
childlogdir=/tmp

[program:api]
directory=/app
command=uvicorn nganyaflow.main:app --host 0.0.0.0 --port 8000 --workers 1 --no-access-log
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
