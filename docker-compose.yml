# Demo and test server for the Android app.
#   docker compose up --build
# Then, for a short-lived public HTTPS address (the app needs HTTPS off the emulator):
#   cloudflared tunnel --url http://localhost:8000
# Stop the tunnel and `docker compose down` when the demo is over.
services:
  nganyaflow:
    build: .
    image: nganyaflow:demo
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Optional shared token for scripts. It acts as every role, so there is no default:
      # unset means the token is disabled and only access codes can write.
      NGANYAFLOW_WRITE_TOKEN: ${NGANYAFLOW_WRITE_TOKEN:-}
      # Keeps clearly labelled synthetic arrivals flowing so estimates are always live.
      NGANYAFLOW_DEMO_MODE: "1"
      # Leave these unset on anything reachable from outside your machine: random codes
      # are generated and saved to the runtime volume (never printed). Read them with
      #   docker compose exec nganyaflow cat /app/runtime/demo-access-codes.txt
      # Fixed codes are for a private local server only.
      NGANYAFLOW_DEMO_ENUMERATOR_CODE: ${NGANYAFLOW_DEMO_ENUMERATOR_CODE:-}
      NGANYAFLOW_DEMO_CREW_CODE: ${NGANYAFLOW_DEMO_CREW_CODE:-}
    volumes:
      - nganyaflow-data:/app/data/raw
      - nganyaflow-artifacts:/app/artifacts
      - nganyaflow-runtime:/app/runtime

volumes:
  nganyaflow-data:
  nganyaflow-artifacts:
  nganyaflow-runtime:
