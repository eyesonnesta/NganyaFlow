[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nganyaflow-server"
version = "0.1.0"
description = "NganyaFlow observation API and waiting-time research pipeline"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "numpy>=2,<3", "scikit-learn>=1.5,<2", "quantile-forest>=1.4,<2",
  "joblib>=1.4,<2", "tzdata>=2024.1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
notebooks = [
  "notebook>=7,<8", "pandas>=2.2,<4", "matplotlib>=3.9,<4",
  "nbclient>=0.10,<1", "nbformat>=5.10,<6"
]

[project.scripts]
nganyaflow = "nganyaflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
